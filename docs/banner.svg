<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#0e1524"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="60%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="80%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.5" stop-color="#c3cbd6"/>
      <stop offset="1" stop-color="#8b96a6"/>
    </radialGradient>
    <radialGradient id="dome" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#4a5568"/>
      <stop offset="1" stop-color="#252c3a"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- robot, top-down -->
  <g transform="translate(210,160)">
    <ellipse cx="0" cy="96" rx="96" ry="18" fill="#05070d" opacity="0.5"/>
    <circle r="120" fill="#0ea5e9" opacity="0.12"/>
    <circle r="112" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="46 700" opacity="0.9"/>
    <circle r="96" fill="url(#body)" stroke="#9aa6b6" stroke-width="1"/>
    <path d="M -68 -55 A 96 96 0 0 1 68 -55" fill="none" stroke="#8b96a6" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
    <circle r="70" fill="#1c2431"/>
    <path d="M 0 0 L 0 -70 A 70 70 0 0 1 52 -47 Z" fill="#38bdf8" opacity="0.18"/>
    <circle r="32" fill="url(#dome)" stroke="#3a4556" stroke-width="1.5"/>
    <rect x="-3" y="-30" width="6" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <circle r="6" fill="#c3cbd6"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(400,0)">
    <text x="0" y="150" fill="#f1f5f9" font-size="72" font-weight="700" letter-spacing="-2">HomeRun Local</text>
    <text x="2" y="196" fill="#94a3b8" font-size="26" font-weight="500">Cloud-free control for the Philips HomeRun XU7100 robot vacuum</text>
    <g transform="translate(2,232)" font-size="19" font-weight="600">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#0ea5e9" opacity="0.15"/>
      <text x="18" y="23" fill="#7dd3fc">LAN control</text>
      <rect x="146" y="0" width="150" height="34" rx="17" fill="#8b5cf6" opacity="0.15"/>
      <text x="164" y="23" fill="#c4b5fd">custom voices</text>
      <rect x="310" y="0" width="180" height="34" rx="17" fill="#22c55e" opacity="0.13"/>
      <text x="328" y="23" fill="#86efac">Home Assistant</text>
    </g>
  </g>
</svg>
